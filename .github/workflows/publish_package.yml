name: Publish Package

on:
  release:
    types:
        - published
  workflow_dispatch: # enables manual triggering

jobs:
  # The whole pull-request suite, by reference: install with all extras, verify the
  # extras arrived, pytest, validate_docs.sh. Until 2026-09-17 nothing between the
  # release event and `poetry publish` ran a test, so a release cut from a red commit
  # would have published (register C-36, mechanical half). `publish` below `needs:`
  # this job, so a red suite means no upload. tests/test_falsification_extras_actually_installed.py
  # (TestPublishGateIsReal) holds this file to a known-good text, so any edit here —
  # an `if:`, a `continue-on-error:`, a different `ref:` — is a red build until the
  # guard's copy is updated on purpose. The guard runs inside the suite it gates, so it
  # protects the pull-request path; a release cut from a branch no PR ever ran on is
  # C-36's open half.
  test:
    uses: ./.github/workflows/run_pytest.yml

  publish:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install Poetry
      run: |
          curl -sSL https://install.python-poetry.org | python3 -

    - name: Install Dependencies
      run: |
          python -m pip install --upgrade pip
          python -m pip install packaging

    - name: Validate Version
      run: |
        latest_version=$(curl -s https://pypi.org/pypi/views-evaluation/json | jq -r .info.version)
        new_version=$(poetry version -s)
        python -c "from packaging.version import parse; assert parse('$new_version') > parse('$latest_version'), 'Version must be higher than $latest_version'"

    - name: Publish to PyPI
      run: poetry publish --build --username __token__ --password ${{ secrets.PYPI_TOKEN }}
