name: Run Pytest

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:
  # Callable by reference from publish_package.yml, so the release gate IS this job —
  # one recipe, nothing copied that could drift (register C-36, mechanical half).
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11" 

    - name: Install Poetry
      run: |
          curl -sSL https://install.python-poetry.org | python3 -

    - name: Install dependencies
      run: |
        # --all-extras is REQUIRED, not tidiness. `views-frames` and `pandas` are
        # optional extras, and tests/test_metric_frame.py and
        # tests/test_evaluation_report.py both guard with a MODULE-LEVEL
        # pytest.importorskip. Without the extras those files are skipped whole and
        # CI reports green without ever touching the MetricFrame cross-repo contract
        # (ADR-022 §1). Guarded by tests/test_falsification_ci_coverage_gap.py.
        poetry install --all-extras

    # Nothing else ever exercises "works without the dev group": the local env and the
    # steps below always carry scikit-learn. `poetry sync --only main` removes the dev
    # group (scikit-learn among it) and keeps the extras; the probe then asserts that
    # scikit-learn is genuinely ABSENT — not merely unloaded, which would be vacuous —
    # and that importing the package does not load pandas, which the extras install
    # (ADR-011; C-05). The reinstall restores the dev group; the verify step below
    # proves the extras are present, and the pytest step needs the dev group or it
    # cannot collect.
    - name: Prove the runtime-only install works
      run: |
        set -e
        poetry sync --only main --all-extras
        poetry run python -c "import sys, importlib.util as u, views_evaluation, views_evaluation.evaluation.metric_frame; assert u.find_spec('sklearn') is None, 'scikit-learn still installed'; assert 'pandas' not in sys.modules, 'import loaded pandas'"
        poetry install --all-extras

    # Proves the extras ARRIVED, not merely that --all-extras was requested.
    # `poetry install` exits 0 even if it resolves without an optional package, and
    # every downstream guard is a module-level pytest.importorskip that turns absence
    # into silence. Without this step a partial install silently shrinks the suite
    # and CI still reports green. Guarded by
    # tests/test_falsification_extras_actually_installed.py.
    - name: Verify optional extras are installed
      run: poetry run python -c "import views_frames, pandas"

    - name: Run tests
      run: |
        set -e
        poetry run pytest tests/

    # Structural documentation checks (CIC references, cross-ADR integrity, unfilled
    # placeholders). Complements tests/test_documentation_contracts.py, which asserts
    # that documented claims match code. Neither ran in CI before 2026-08-02, which is
    # how the README shipped a promise the package did not keep (register C-29).
    - name: Validate documentation consistency
      run: bash documentation/validate_docs.sh
