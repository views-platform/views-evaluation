name: Run Pytest

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11" 

    - name: Install Poetry
      run: |
          curl -sSL https://install.python-poetry.org | python3 -

    - name: Install dependencies
      run: |
        # --all-extras is REQUIRED, not tidiness. `views-frames` and `pandas` are
        # optional extras, and tests/test_metric_frame.py (44 tests) and
        # tests/test_evaluation_report.py (22 tests) both guard with a MODULE-LEVEL
        # pytest.importorskip. Without the extras those files are skipped whole and
        # CI reports a green "293 passed" that never touched the MetricFrame
        # cross-repo contract (ADR-022 §1). Guarded by
        # tests/test_falsification_ci_coverage_gap.py.
        poetry install --all-extras

    # Proves the extras ARRIVED, not merely that --all-extras was requested.
    # `poetry install` exits 0 even if it resolves without an optional package, and
    # every downstream guard is a module-level pytest.importorskip that turns absence
    # into silence. Without this step a partial install shrinks the suite by 66 tests
    # and CI still reports green. Guarded by
    # tests/test_falsification_extras_actually_installed.py.
    - name: Verify optional extras are installed
      run: poetry run python -c "import views_frames, pandas"

    - name: Run tests
      run: |
        set -e
        poetry run pytest tests/

    # Structural documentation checks (CIC references, cross-ADR integrity, unfilled
    # placeholders). Complements tests/test_documentation_contracts.py, which asserts
    # that documented claims match code. Neither ran in CI before 2026-08-02, which is
    # how the README shipped a promise the package did not keep (register C-29).
    - name: Validate documentation consistency
      run: bash documentation/validate_docs.sh
